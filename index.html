let draft=null,solution=null;const read=()=>({start:{x:+$('sx').value,y:+$('sy').value},end:{x:+$('ex').value,y:+$('ey').value},target:{x:+$('tx').value,y:+$('ty').value},map:maps[$('mapSelect').value]});const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const at=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});

function calculateByMode(){const v=read(),route=dist(v.start,v.end);if(!route){$('notice').textContent='항로 시작점과 종료점을 다르게 설정해 주세요.';return}$('notice').textContent='';const rule=v.map.size===4?{d:1.2,s:165,label:'4×4 사녹'}:{d:.7,s:200,label:'8×8 맵'};const dir={x:(v.end.x-v.start.x)/route,y:(v.end.y-v.start.y)/route},desired={x:v.target.x-dir.x*rule.d,y:v.target.y-dir.y*rule.d},progress=Math.max(0,Math.min(1,((desired.x-v.start.x)*dir.x+(desired.y-v.start.y)*dir.y)/route));let exit=at(v.start,v.end,progress),waypoint=null,corridorName='';const useTerrain=$('mode').value==='terrain'&&terrain[$('mapSelect').value];if(useTerrain){const options=[{waypoint:null,name:'직선 경로'}];lowCorridors[$('mapSelect').value].forEach(c=>c.points.forEach(point=>options.push({waypoint:{x:point[0],y:point[1]},name:c.name})));let best=null;options.forEach(option=>{const points=option.waypoint?[exit,option.waypoint,v.target]:[exit,v.target],profile=routeProfile($('mapSelect').value,points),length=pathLength(points),score=length+profile.average*.24+profile.max*.18;if(!best||score<best.score)best={...option,profile,length,score}});if(best.waypoint){const early=Math.min(.55,Math.max(0,best.length-rule.d));exit={x:exit.x-dir.x*early,y:exit.y-dir.y*early};waypoint=best.waypoint;corridorName=best.name}}const points=waypoint?[exit,waypoint,v.target]:[exit,v.target],actual=pathLength(points),profile=useTerrain?routeProfile($('mapSelect').value,points):null;solution={exit,target:v.target,waypoint,actual,rule,profile,corridorName};$('drop').textContent=`${Math.round((rule.d+Math.max(0,actual-rule.d))*1000)} m 전`;$('speed').textContent=`${rule.s} km/h`;$('vertical').textContent='100 m';$('distance').textContent=`${Math.round(actual*1000)} m`;$('explain').textContent=profile?`${rule.label} + 상대 고도 보정: 평균 지형 등급 ${profile.average.toFixed(1)}, 최고 등급 ${profile.max}. ${waypoint?`${corridorName} 저지대 통로를 경유하도록 더 이른 낙하 지점을 추천합니다.`:'직선 경로가 저지대 경유보다 유리해 기본 공식을 유지합니다.'}`:`${rule.label} 기본 고정 공식: 목표 ${rule.d} km 전에 낙하해 function calculate(){const v=read(),route=dist(v.start,v.end);if(!route){$('notice').textContent='항로 시작점과 종료점을 다르게 설정해 주세요.';return}$('notice').textContent='';const rule=v.map.size===4?{d:1.2,s:165,label:'4×4 사녹'}:{d:.7,s:200,label:'8×8 맵'};const dir={x:(v.end.x-v.start.x)/route,y:(v.end.y-v.start.y)/route},desired={x:v.target.x-dir.x*rule.d,y:v.target.y-dir.y*rule.d},progress=Math.max(0,Math.min(1,((desired.x-v.start.x)*dir.x+(desired.y-v.start.y)*dir.y)/route));let exit=at(v.start,v.end,progress),waypoint=null,corridorName='';if(terrain[$('mapSelect').value]){const options=[{waypoint:null,name:'직선 경로'}];lowCorridors[$('mapSelect').value].forEach(c=>c.points.forEach(point=>options.push({waypoint:{x:point[0],y:point[1]},name:c.name})));let best=null;options.forEach(option=>{const points=option.waypoint?[exit,option.waypoint,v.target]:[exit,v.target],profile=routeProfile($('mapSelect').value,points),length=pathLength(points),score=length+profile.average*.24+profile.max*.18;if(!best||score<best.score)best={...option,profile,length,score}});if(best.waypoint){const early=Math.min(.55,Math.max(0,best.length-rule.d));exit={x:exit.x-dir.x*early,y:exit.y-dir.y*early};waypoint=best.waypoint;corridorName=best.name}}const points=waypoint?[exit,waypoint,v.target]:[exit,v.target],actual=pathLength(points),profile=terrain[$('mapSelect').value]?routeProfile($('mapSelect').value,points):null;solution={exit,target:v.target,waypoint,actual,rule,profile,corridorName};$('drop').textContent=`${Math.round((rule.d+Math.max(0,actual-rule.d))*1000)} m 전`;$('speed').textContent=`${rule.s} km/h`;$('vertical').textContent='100 m';$('distance').textContent=`${Math.round(actual*1000)} m`;$('explain').textContent=profile?`${rule.label} + 상대 고도 보정: 평균 지형 등급 ${profile.average.toFixed(1)}, 최고 등급 ${profile.max}. ${waypoint?`${corridorName} 저지대 통로를 경유하도록 더 이른 낙하 지점을 추천합니다.`:'직선 경로가 저지대 경유보다 유리해 기본 공식을 유지합니다.'}`:`${rule.label} 고정 공식 적용: 목표 ${rule.d} km 전에 낙하해 ${rule.s} km/h를 유지한 뒤, 고도 100 m에서 수직 하강하세요.`;draw()}
function draw(){const v=read(),map=v.map,img=imgs[$('mapSelect').value],w=800,h=800,p=q=>({x:q.x/map.size*w,y:h-q.y/map.size*h});ctx.clearRect(0,0,w,h);if(img?.complete)ctx.drawImage(img,0,0,w,h);else{ctx.fillStyle='#102530';ctx.fillRect(0,0,w,h)}if($('terrain').checked&&terrain[$('mapSelect').value]){const cols={0:'#50d18a',2:'#e0c263',3:'#d87849'};terrain[$('mapSelect').value].forEach(([name,level,points])=>{ctx.beginPath();points.forEach((q,i)=>{const a=p({x:q[0],y:q[1]});i?ctx.lineTo(a.x,a.y):ctx.moveTo(a.x,a.y)});ctx.closePath();ctx.fillStyle=cols[level]+'55';ctx.fill();ctx.strokeStyle=cols[level];ctx.lineWidth=2;ctx.stroke()})}const line=(a,b,color,width=4,dash=[])=>{const A=p(a),B=p(b);ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.restore()};line(v.start,v.end,'#e8f0fb',3);if(draft)line(draft.start,draft.end,'#e8f0fb',3,[10,7]);if(solution){if(solution.waypoint){line(solution.exit,solution.waypoint,'#ffb44b',5);line(solution.waypoint,solution.target,'#63d7ff',5);mark(solution.waypoint,'#63d7ff','저지대 경유')}else line(solution.exit,solution.target,'#ffb44b',5);mark(solution.exit,'#ffb44b','낙하');mark(solution.target,'#ff7272','목표')}mark(v.start,'#e8f0fb','시작',5);mark(v.end,'#e8f0fb','종료',5)}
const drawCore=draw;
draw=function(){drawCore();const v=read(),radius=+$('radius').value/1000,cx=v.target.x/v.map.size*800,cy=800-v.target.y/v.map.size*800,pxRadius=radius/v.map.size*800;ctx.save();ctx.setLineDash([10,8]);ctx.strokeStyle='rgba(99,215,255,.95)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,pxRadius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#dff8ff';ctx.font='600 13px system-ui';ctx.strokeStyle='rgba(0,0,0,.72)';ctx.lineWidth=3;const label=`선택 반경 ${radius} km`;ctx.strokeText(label,cx+12,cy-pxRadius-10);ctx.fillText(label,cx+12,cy-pxRadius-10);ctx.restore()};
const drawWithCircle=draw;
draw=function(){drawWithCircle();if($('mode').value!=='fixed'||!solution)return;const v=read(),radius=+$('radius').value/1000,gap=solution.actual-radius;if(gap<=.001)return;const dx=solution.exit.x-v.target.x,dy=solution.exit.y-v.target.y,length=Math.hypot(dx,dy),edge={x:v.target.x+dx/length*radius,y:v.target.y+dy/length*radius},toCanvas=q=>({x:q.x/v.map.size*800,y:800-q.y/v.map.size*800}),a=toCanvas(solution.exit),b=toCanvas(edge);ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle='#ff7181';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffe2e7';ctx.font='600 13px system-ui';ctx.strokeStyle='rgba(0,0,0,.72)';ctx.lineWidth=3;const label=`반경 밖 +${Math.round(gap*1000)} m`;ctx.strokeText(label,(a.x+b.x)/2+8,(a.y+b.y)/2-8);ctx.fillText(label,(a.x+b.x)/2+8,(a.y+b.y)/2-8);ctx.restore()};
function mark(q,color,label,r=7){const v=read(),a={x:q.x/v.map.size*800,y:800-q.y/v.map.size*800};ctx.fillStyle=color;ctx.beginPath();ctx.arc(a.x,a.y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='600 13px system-ui';ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=3;ctx.strokeText(label,a.x+9,a.y-8);ctx.fillText(label,a.x+9,a.y-8)}
const drawWithSecrets=draw;
draw=function(){drawWithSecrets();const points=secretRooms[$('mapSelect').value];if(!secretsVisible||!points)return;const size=read().map.size;ctx.save();points.forEach(([x,y])=>{const px=x/size*800,py=800-y/size*800;ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff0f3';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill()});ctx.restore()};
function circleExit(v,radius){const dx=v.end.x-v.start.x,dy=v.end.y-v.start.y,fx=v.start.x-v.target.x,fy=v.start.y-v.target.y,a=dx*dx+dy*dy,b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-radius*radius,disc=b*b-4*a*c;if(disc<0)return null;const roots=[(-b-Math.sqrt(disc))/(2*a),(-b+Math.sqrt(disc))/(2*a)].filter(t=>t>=0&&t<=1).sort((a,b)=>a-b);return roots.length?at(v.start,v.end,roots[0]):null}
const calculateByModeCore=calculateByMode;
calculateByMode=function(){calculateByModeCore();if(!solution)return;solution.rule.d=+$('radius').value/1000;const v=read();solution.rule.s=v.map.size===8?(solution.rule.d===.6?210:(solution.rule.d===1||solution.rule.d===1.1?165:200)):165;$('speed').textContent=`${solution.rule.s} km/h`;if($('mode').value!=='terrain'){const exactExit=circleExit(v,solution.rule.d);if(exactExit){solution.exit=exactExit;solution.actual=solution.rule.d;$('notice').textContent='선택한 반경 원과 비행기 항로의 첫 교차점을 낙하점으로 표시합니다.';draw()}else $('notice').textContent='비행기 항로가 선택한 반경 원을 지나지 않습니다. 지도상 낙하점은 가장 가까운 항로 지점입니다.';$('drop').textContent=`${Math.round(solution.rule.d*1000)} m 전`;$('distance').textContent=`${Math.round(solution.actual*1000)} m`;return}if(!solution?.profile)return;const route=dist(v.start,v.end),dir={x:(v.end.x-v.start.x)/route,y:(v.end.y-v.start.y)/route};const extra=Math.min(.55,Math.max(0,solution.profile.average-1)*.18+Math.max(0,solution.profile.max-1)*.14);if(extra<.01){$('drop').textContent=`${Math.round(solution.rule.d*1000)} m 전`;$('explain').textContent+=' 현재 경로는 분석된 고지대를 지나지 않아 기본 공식과 같은 결과입니다.';return}solution.exit={x:solution.exit.x-dir.x*extra,y:solution.exit.y-dir.y*extra};solution.actual+=extra;$('drop').textContent=`${Math.round((solution.rule.d+extra)*1000)} m 전`;$('distance').textContent=`${Math.round(solution.actual*1000)} m`;$('explain').textContent+=` 능선 노출 보정으로 ${Math.round(extra*1000)} m 더 이른 낙하를 적용했습니다.`;draw()};
calculate=calculateByMode;
function point(e){const r=canvas.getBoundingClientRect(),m=read().map;return{x:(e.clientX-r.left)/r.width*m.size,y:(1-(e.clientY-r.top)/r.height)*m.size}}canvas.addEventListener('click',e=>{if(e.button!==0)return;const q=point(e);$('tx').value=q.x.toFixed(2);$('ty').value=q.y.toFixed(2);calculate()});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{if(e.button!==2)return;e.preventDefault();const q=point(e);draft={start:q,end:q};canvas.setPointerCapture(e.pointerId);draw()});canvas.addEventListener('pointermove',e=>{if(!draft)return;draft.end=point(e);draw()});canvas.addEventListener('pointerup',e=>{if(!draft||e.button!==2)return;draft.end=point(e);$('sx').value=draft.start.x.toFixed(2);$('sy').value=draft.start.y.toFixed(2);$('ex').value=draft.end.x.toFixed(2);$('ey').value=draft.end.y.toFixed(2);draft=null;calculate()});$('mapSelect').addEventListener('change',()=>{const d=maps[$('mapSelect').value].defaults;['sx','sy','ex','ey','tx','ty'].forEach((id,i)=>$(id).value=d[i]);$('terrain').disabled=!terrain[$('mapSelect').value];if($('terrain').disabled)$('terrain').checked=false;$('terrainHint').textContent=terrain[$('mapSelect').value]?'기본 고정 공식은 거리만 사용합니다. 상대 고도 보정은 능선·저지대 자료를 함께 사용합니다.':'이 맵의 상대 고도 레이어 자료는 아직 없습니다.';calculate()});$('mode').addEventListener('change',calculate);$('terrain').addEventListener('change',draw);['sx','sy','ex','ey','tx','ty'].forEach(id=>$(id).addEventListener('change',calculate));window.addEventListener('resize',draw);calculate();
$('radius').addEventListener('change',calculate);
$('mapSelect').addEventListener('change',()=>{$('radius').value=maps[$('mapSelect').value].size===4?'1200':'700';calculate()});
function updateSecretButton(){const available=Boolean(secretRooms[$('mapSelect').value]);secretButton.disabled=!available;if(!available){secretsVisible=false;secretButton.textContent='비밀의 방 없음';secretButton.setAttribute('aria-pressed','false')}else secretButton.textContent=secretsVisible?'비밀의 방 숨기기':'비밀의 방 보기';draw()}
secretButton.addEventListener('click',()=>{if(secretButton.disabled)return;secretsVisible=!secretsVisible;secretButton.setAttribute('aria-pressed',String(secretsVisible));secretButton.textContent=secretsVisible?'비밀의 방 숨기기':'비밀의 방 보기';draw()});
$('mapSelect').addEventListener('change',updateSecretButton);updateSecretButton();
</script></body></html>
